<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="description" content="Find the EventPix logo before time runs out." />
    <title>EventPix Click Rush</title>
    <style>
      :root { --red: #ed1b3a; --ink: #292832; --paper: #faf9f6; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { background: var(--paper); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
      button { font: inherit; -webkit-tap-highlight-color: transparent; }
      .game {
        position: relative; display: flex; min-height: 100vh; align-items: center; justify-content: center;
        overflow: hidden; padding: 76px 28px 28px;
        background: radial-gradient(circle at 15% 15%, rgba(237,27,58,.055), transparent 28%),
          radial-gradient(circle at 85% 82%, rgba(110,93,158,.06), transparent 30%), #faf9f6;
      }
      .game::before {
        position: absolute; inset: 0; content: ""; pointer-events: none;
        background-image: radial-gradient(rgba(34,31,36,.12) .55px, transparent .55px);
        background-size: 7px 7px; opacity: .23; mix-blend-mode: multiply;
      }
      .progress { position: fixed; inset: 0 0 auto; z-index: 30; height: 4px; background: rgba(35,32,38,.07); }
      .progress span { display: block; width: 100%; height: 100%; background: var(--red); transition: width .35s linear; }
      .hud {
        position: fixed; top: 16px; left: 50%; z-index: 30; display: flex; height: 48px; align-items: center;
        gap: 15px; padding: 5px 12px; border: 1px solid rgba(38,33,40,.1); border-radius: 999px;
        background: rgba(255,255,255,.86); box-shadow: 0 8px 30px rgba(41,32,44,.09);
        backdrop-filter: blur(12px); transform: translateX(-50%);
      }
      .hud-stat { display: flex; min-width: 44px; align-items: center; gap: 7px; color: #5b5660; font-size: 20px; }
      .hud-stat b { min-width: 18px; color: var(--ink); font-size: 18px; line-height: 1; }
      .mini-target { position: relative; display: block; width: 35px; height: 35px; overflow: hidden; border: 1px solid #eee8e5; border-radius: 50%; background: #fff; }
      .eventpix-image { position: absolute; top: -4%; left: 50%; width: 150%; max-width: none; height: auto; transform: translateX(-50%); }
      .logo-grid { position: relative; z-index: 2; display: grid; width: min(1100px,100%); grid-template-columns: repeat(8,minmax(64px,1fr)); gap: clamp(9px,1.1vw,16px); }
      .logo-tile {
        display: grid; min-width: 0; aspect-ratio: 1; place-items: center; padding: 7px;
        border: 1.5px solid rgba(40,37,43,.55); border-radius: 50%; background: rgba(255,255,255,.6);
        color: var(--ink); cursor: pointer; box-shadow: 0 2px 0 rgba(40,37,43,.04);
        transition: transform .12s ease, opacity .11s ease, background .12s ease;
      }
      .playing .logo-tile:hover, .playing .logo-tile:focus-visible { z-index: 3; outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(237,27,58,.11); transform: scale(1.08); }
      .logo-tile:disabled { cursor: default; }
      .mark, .eventpix-mark, .team-face { position: relative; display: grid; width: 76%; height: 76%; overflow: hidden; place-items: center; border-radius: 50%; }
      .eventpix-mark { width: 82%; height: 82%; background: #fff; }
      .team-face { width: 84%; height: 84%; border: 2px solid #fff; background: #e9e8e5; box-shadow: 0 2px 9px rgba(36,30,38,.16); }
      .team-face img { width: 100%; height: 100%; object-fit: cover; object-position: center 27%; }
      .mark::before, .mark::after { position: absolute; content: ""; }
      .shutter { background: repeating-conic-gradient(from 4deg, currentColor 0 36deg, #fff 38deg 45deg); }
      .shutter::after { width: 35%; height: 35%; border-radius: 50%; background: var(--paper); }
      .lens { border: 4px solid currentColor; box-shadow: inset 0 0 0 8px var(--paper), inset 0 0 0 12px currentColor; }
      .lens::after { width: 18%; height: 18%; border-radius: 50%; background: currentColor; }
      .focus { border: 3px solid currentColor; }
      .focus::before { width: 72%; height: 72%; border: 3px dashed currentColor; border-radius: 23%; }
      .focus::after { width: 21%; height: 21%; border-radius: 50%; background: currentColor; }
      .gridmark { border-radius: 22%; background: linear-gradient(90deg,transparent 43%,#fff 43% 57%,transparent 57%), linear-gradient(transparent 43%,#fff 43% 57%,transparent 57%), currentColor; }
      .spark { background: currentColor; }
      .spark::before { width: 62%; height: 62%; background: #fff; clip-path: polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%); }
      .hex { border-radius: 0; background: currentColor; clip-path: polygon(25% 7%,75% 7%,100% 50%,75% 93%,25% 93%,0 50%); }
      .hex::after { width: 45%; height: 45%; background: #fff; clip-path: inherit; }
      .orbit { border: 3px solid currentColor; }
      .orbit::before { width: 92%; height: 35%; border: 3px solid currentColor; border-radius: 50%; transform: rotate(45deg); }
      .orbit::after { width: 15%; height: 15%; border-radius: 50%; background: currentColor; }
      .red { color:#e62a45; } .coral { color:#ef756f; } .rose { color:#da8c96; }
      .violet { color:#7c6da8; } .slate { color:#6b7f87; } .ink { color:#2d2e34; }
      .logo-tile.popped { pointer-events: none; opacity: 0; transform: scale(.1) rotate(25deg); }
      .logo-tile.missed { animation: wrong .18s ease; background: rgba(237,27,58,.08); }
      .logo-tile.fun { z-index: 4; animation: face-pop .42s ease; background: rgba(237,27,58,.08); box-shadow: 0 0 0 5px rgba(237,27,58,.1); }
      .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(250,249,246,.64); backdrop-filter: blur(6px); }
      .overlay[hidden] { display: none; }
      .confetti { position:fixed; inset:0; z-index:25; overflow:hidden; pointer-events:none; }
      .confetti-piece { position:absolute; top:-24px; width:9px; height:16px; border-radius:2px; opacity:0; animation-name:confetti-fall; animation-timing-function:cubic-bezier(.2,.7,.35,1); animation-fill-mode:both; }
      .confetti-piece:nth-child(3n) { width:12px; height:12px; border-radius:50%; }
      .confetti-piece:nth-child(4n) { width:7px; height:20px; }
      .finished .overlay { z-index:30; background:transparent; backdrop-filter:none; pointer-events:none; }
      .finished .final { pointer-events:auto; }
      .action, .restart { display: grid; place-items: center; border: 0; border-radius: 50%; cursor: pointer; background: var(--red); color: #fff; }
      .action { width: 82px; height: 82px; box-shadow: 0 14px 40px rgba(237,27,58,.28); }
      .play-icon { width: 0; height: 0; margin-left: 6px; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-left: 24px solid #fff; }
      .action:hover, .action:focus-visible, .restart:hover, .restart:focus-visible { outline: 5px solid rgba(237,27,58,.16); transform: scale(1.06); }
      .final { display:flex; width:160px; min-height:76px; align-items:center; justify-content:center; gap:13px; padding:10px 10px 10px 17px; border:1px solid rgba(41,35,42,.1); border-radius:999px; background:rgba(255,255,255,.94); color:var(--red); box-shadow:0 18px 50px rgba(40,31,42,.14); }
      .final strong { min-width:35px; color:var(--ink); font-size:34px; letter-spacing:-1px; }
      .restart { width:52px; height:52px; font-size:29px; }
      @keyframes wrong { 0%,100%{transform:translateX(0)} 35%{transform:translateX(-3px)} 70%{transform:translateX(3px)} }
      @keyframes face-pop { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(1.17) rotate(-5deg)} 70%{transform:scale(1.1) rotate(5deg)} }
      @keyframes confetti-fall { 0%{opacity:0;transform:translate3d(0,-8vh,0) rotate(0)} 8%,88%{opacity:1} 100%{opacity:0;transform:translate3d(var(--drift),112vh,0) rotate(var(--spin))} }
      @media (max-width:780px) { .game{min-height:100svh;padding:74px 14px 18px;align-items:start}.logo-grid{grid-template-columns:repeat(6,minmax(43px,1fr));gap:8px} }
      @media (max-width:500px) { .game{padding-inline:10px}.logo-grid{grid-template-columns:repeat(5,minmax(42px,1fr));gap:7px}.logo-tile{padding:4px;border-width:1.2px} }
      @media (max-height:700px) and (min-width:781px) { .logo-grid{width:min(850px,100%)} }
      @media (prefers-reduced-motion:reduce) { .confetti{display:none} *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }
    </style>
  </head>
  <body>
    <main class="game ready" id="game">
      <div class="progress" aria-hidden="true"><span id="progress"></span></div>
      <div class="hud" aria-live="polite">
        <span class="hud-stat"><span aria-hidden="true">◷</span><b id="time">30</b></span>
        <span class="mini-target" aria-hidden="true"><img class="eventpix-image" src="./eventpix-logo.png" alt="" /></span>
        <span class="hud-stat"><span aria-hidden="true">★</span><b id="score">0</b></span>
      </div>
      <section class="logo-grid" id="grid" aria-label="Find the EventPix logo"></section>
      <div class="overlay" id="overlay">
        <button class="action" id="start" type="button" aria-label="Start game"><span class="play-icon"></span></button>
      </div>
    </main>
    <script>
      (() => {
        const SECONDS = 30;
        const SIZE = 48;
        const faces = ["./team-1.png", "./team-2.png", "./team-3.png"];
        const types = ["shutter","lens","focus","gridmark","spark","hex","orbit"];
        const tones = ["red","coral","rose","violet","slate","ink"];
        const confettiColors = ["#ed1b3a","#ffbf3f","#7c6da8","#2bb7a9","#ef756f","#ffffff"];
        const game = document.getElementById("game");
        const grid = document.getElementById("grid");
        const overlay = document.getElementById("overlay");
        const timeNode = document.getElementById("time");
        const scoreNode = document.getElementById("score");
        const progress = document.getElementById("progress");
        let status = "ready";
        let score = 0;
        let timeLeft = SECONDS;
        let interval;
        let locked = false;

        const randomIndex = (max) => Math.floor(Math.random() * max);

        function makeRound(random = true) {
          const target = random ? randomIndex(SIZE) : 18;
          const facePositions = random ? new Set() : new Set([5, 28, 41]);
          while (facePositions.size < faces.length) {
            const position = randomIndex(SIZE);
            if (position !== target) facePositions.add(position);
          }
          const faceIndexes = [...facePositions];
          grid.replaceChildren();

          for (let index = 0; index < SIZE; index += 1) {
            const button = document.createElement("button");
            button.className = "logo-tile";
            button.type = "button";
            button.disabled = status !== "playing";

            if (index === target) {
              button.classList.add("target");
              button.setAttribute("aria-label", "EventPix logo");
              button.innerHTML = '<span class="eventpix-mark"><img class="eventpix-image" src="./eventpix-logo.png" alt="EventPix" /></span>';
              button.addEventListener("click", () => hitTarget(button));
            } else if (facePositions.has(index)) {
              const faceIndex = faceIndexes.indexOf(index);
              button.classList.add("face");
              button.setAttribute("aria-label", "Team member");
              button.innerHTML = `<span class="team-face"><img src="${faces[faceIndex]}" alt="Team member" /></span>`;
              button.addEventListener("click", () => funFace(button));
            } else {
              const typeIndex = random ? randomIndex(types.length) : (index * 5 + 2) % types.length;
              const toneIndex = random ? randomIndex(tones.length) : (index * 7 + 1) % tones.length;
              button.setAttribute("aria-label", "Other logo");
              button.innerHTML = `<span class="mark ${types[typeIndex]} ${tones[toneIndex]}"></span>`;
              button.addEventListener("click", () => miss(button));
            }
            grid.append(button);
          }
        }

        function startGame() {
          clearInterval(interval);
          document.querySelector(".confetti")?.remove();
          status = "playing";
          score = 0;
          timeLeft = SECONDS;
          locked = false;
          game.className = "game playing";
          overlay.hidden = true;
          scoreNode.textContent = "0";
          timeNode.textContent = String(SECONDS);
          progress.style.width = "100%";
          makeRound();
          interval = setInterval(() => {
            timeLeft -= 1;
            timeNode.textContent = String(timeLeft);
            progress.style.width = `${(timeLeft / SECONDS) * 100}%`;
            if (timeLeft <= 0) finishGame();
          }, 1000);
        }

        function hitTarget(button) {
          if (status !== "playing" || locked) return;
          locked = true;
          score += 1;
          scoreNode.textContent = String(score);
          button.classList.add("popped");
          setTimeout(() => { if (status === "playing") { makeRound(); locked = false; } }, 115);
        }

        function funFace(button) {
          if (status !== "playing" || locked) return;
          button.classList.remove("fun");
          void button.offsetWidth;
          button.classList.add("fun");
          setTimeout(() => button.classList.remove("fun"), 420);
        }

        function miss(button) {
          if (status !== "playing" || locked) return;
          button.classList.add("missed");
          setTimeout(() => button.classList.remove("missed"), 180);
        }

        function finishGame() {
          clearInterval(interval);
          status = "finished";
          locked = true;
          game.className = "game finished";
          [...grid.children].forEach((tile) => { tile.disabled = true; });
          launchConfetti();
          overlay.hidden = false;
          overlay.innerHTML = `<div class="final"><span aria-hidden="true">★</span><strong>${score}</strong><button class="restart" type="button" aria-label="Play again">↻</button></div>`;
          overlay.querySelector("button").addEventListener("click", startGame);
        }

        function launchConfetti() {
          document.querySelector(".confetti")?.remove();
          const confetti = document.createElement("div");
          confetti.className = "confetti";
          confetti.setAttribute("aria-hidden", "true");
          for (let index = 0; index < 80; index += 1) {
            const piece = document.createElement("span");
            piece.className = "confetti-piece";
            piece.style.left = `${(index * 37) % 101}%`;
            piece.style.backgroundColor = confettiColors[index % confettiColors.length];
            piece.style.animationDelay = `${(index % 16) * .035}s`;
            piece.style.animationDuration = `${2.1 + (index % 9) * .12}s`;
            piece.style.setProperty("--drift", `${((index * 29) % 180) - 90}px`);
            piece.style.setProperty("--spin", `${540 + (index % 5) * 180}deg`);
            confetti.append(piece);
          }
          document.body.append(confetti);
          setTimeout(() => confetti.remove(), 3600);
        }

        document.getElementById("start").addEventListener("click", startGame);
        makeRound(false);
      })();
    </script>
  </body>
</html>
